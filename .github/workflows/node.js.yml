name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ]
  # 允许在 GitHub 网页端的 Actions 页面手动点击按钮重新部署
  workflow_dispatch:

# 必须设置权限，允许 Actions 往 GitHub Pages 发布内容
permissions:
  contents: read
  pages: write
  id-token: write

# 避免连续多次 push 时任务冲突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist' # Vite 打包生成的产物目录

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
